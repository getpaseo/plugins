name: Submit a plugin
description: List your plugin on paseo.sh/plugins.
labels: ["submission"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: >-
        Where does your plugin live? Paste the link or the source you install it from.
        Supported: a GitHub URL, including one to a folder inside the repository,
        an npm package, or anything `paseo plugin add` accepts.
      placeholder: "https://github.com/acme/paseo-review"
    validations:
      required: true
  - type: checkboxes
    id: categories
    attributes:
      label: Categories
      description: What does it do? Tick everything that fits. The first tick is the main one.
      options:
        - label: Daemon management
        - label: Themes
        - label: Providers
        - label: Orchestration
        - label: Git
        - label: Workspaces
        - label: Sidebar
        - label: Extras
        - label: Utils
