name: Submit a plugin
description: List a pinned npm or GitHub plugin on paseo.sh/plugins.
title: "Submit: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Publish an npm package or a tagged GitHub repository containing `paseo-plugin.json`. A bot pins the artifact and opens a pull request. A maintainer reviews each submission and update before it is listed.
  - type: input
    id: package
    attributes:
      label: Plugin source
      description: An npm package name, https://github.com/owner/repository URL plus Plugin path below, or owner/repository:path shorthand. Git repositories need a release tag.
      placeholder: "@acme/paseo-review"
    validations:
      required: true
  - type: input
    id: plugin-path
    attributes:
      label: Plugin path
      description: Optional relative directory inside a Git repository.
  - type: checkboxes
    id: categories
    attributes:
      label: Categories
      description: Tick every category that fits. The first one ticked is the primary category.
      options:
        - label: Themes
        - label: Agents & providers
        - label: Monitoring & orchestration
        - label: Timeline & composer
        - label: Workspace panels
        - label: Git & code review
        - label: Automation & scheduling
        - label: Notifications
        - label: Usage & pricing
        - label: Integrations
        - label: Utilities
  - type: input
    id: listing-id
    attributes:
      label: Listing ID
      description: Optional slug in owner/slug. The owner comes from the source repository.
      placeholder: review
