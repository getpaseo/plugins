name: Submission

on:
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number, or leave empty to recover all waiting submissions
        required: false
        type: string

concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue_number || 'recovery' }}
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name != 'issues' || (github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'submission'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PLUGINS_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PLUGINS_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure author and ensure the label exists
        run: |
          git config user.name "paseo-plugins[bot]"
          git config user.email "plugins@paseo.sh"
          gh label create submission --color 0E8A16 --description "Plugin submission" --force
          gh label create needs-maintainer --color D93F0B --description "Requires a maintainer decision" --force
      - name: Open review PRs for submissions
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            node scripts/submit.ts
          else
            node scripts/retry-submissions.ts
          fi
