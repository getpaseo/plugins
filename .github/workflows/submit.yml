name: Submission

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open submission issue to process again
        required: true
        type: string

concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name != 'issues' || (github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'submission'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PLUGINS_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PLUGINS_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure author and ensure the label exists
        run: |
          git config user.name "paseo-plugins[bot]"
          git config user.email "plugins@paseo.sh"
          gh label create submission --color 0E8A16 --description "Plugin submission" --force
          gh label create needs-maintainer --color D93F0B --description "Requires a maintainer decision" --force
      - name: Pin, validate inline, and open or update review PRs
        # submit.ts runs npm test and validate --online --changed before pushing/creating a PR,
        # recording success in its body. GITHUB_TOKEN PRs do not trigger Validate.
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/submit.ts
